<footer class="site-footer">
  <div class="wrap site-footer__inner">
    <div class="site-footer__brand">
      <img
        src="{{ '/assets/logos/main-logo-transparent.svg' | relative_url }}"
        alt="{{ site.company.legal_name }}"
        width="170" height="170" loading="lazy">
    </div>

    <div class="site-footer__col">
      <h2 class="site-footer__heading">Explore</h2>
      <ul class="site-footer__links">
        {%- for item in site.nav -%}
        <li><a href="{{ item.url | relative_url }}">{{ item.title }}</a></li>
        {%- endfor -%}
      </ul>
    </div>

    <div class="site-footer__col">
      <h2 class="site-footer__heading">Get in touch</h2>
      <ul class="site-footer__links">
        <li><a href="mailto:{{ site.company.email }}">{{ site.company.email }}</a></li>
        <li><a href="tel:{{ site.company.phone_link }}">{{ site.company.phone_display }}</a></li>
        <li><a href="{{ site.company.linkedin }}" rel="noopener">LinkedIn</a></li>
      </ul>
    </div>
  </div>

  <div class="wrap site-footer__legal">
    <p>&copy; {{ 'now' | date: "%Y" }} {{ site.company.legal_name }}. All rights reserved.</p>
  </div>
</footer>
