<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -190 1600 910" width="1600" height="910" role="img" aria-label="Line drawing of the Philadelphia skyline, from the University City towers through City Hall to the Benjamin Franklin Bridge">
  <!--
    Rendered only as a CSS background behind the .hero / .page-head navy
    gradient (see assets/css/style.css), which sits at 68-74% alpha. Stroke
    opacities are tuned to survive that overlay: outlines read at ~.9, with
    detail lines dropping to ~.4 so they fade out rather than turning to noise.
    The .9 outline is the ceiling — any higher and the brightest stroke stops
    clearing 4.5:1 against the sky-blue hero lead that sits over it.

    Framing: `cover` scales the artwork to the container's width, so the
    visible band is always 1600 * (container height / container width) user
    units — roughly 190 units on the short .page-head banner against roughly
    600 on the .hero. The city is drawn at full size and then scaled to 65% by
    the transform below, which lands the whole skyline in a ~280-unit band
    running from y=218 (the Comcast Technology Center crown) to the y=495
    shoreline. The viewBox then starts at y=-190 rather than 0: that headroom
    is empty sky, and it is what keeps the towers clear of the hero copy. The
    banner centres the band and keeps the crowns and upper towers; the hero
    anchors the artwork to the top, which puts 408 units of sky behind the
    eyebrow, headline, and lead, lands the crowns just under the lead's last
    line, and crops the towers at the hero's lower edge — the shoreline and
    water below it never show there, by design.

    Inside that transform the city is drawn to a single scale of 0.38 units per
    foot off its local y=555 shoreline, so relative heights match the real
    skyline: Comcast Technology Center (1,121 ft) is tallest, then Comcast
    Center, One and Two Liberty Place, BNY Mellon Center, Three Logan Square,
    and so on down to City Hall (548 ft to the top of William Penn's hat) and
    PSFS. Strokes inside are set to 3 so they render at ~2 once scaled, which
    matches the shoreline and water drawn outside the transform.
  -->
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16386e"/>
      <stop offset="1" stop-color="#081b38"/>
    </linearGradient>
  </defs>

  <rect x="0" y="-190" width="1600" height="910" fill="url(#hero-bg)"/>

  <g fill="none" stroke="#9bc6df" stroke-linecap="round" stroke-linejoin="round">

    <!-- Sun, carried over from the previous artwork. -->
    <g stroke-opacity=".2" stroke-width="2">
      <circle cx="300" cy="150" r="80"/>
      <circle cx="300" cy="150" r="136"/>
    </g>

    <!-- Shoreline, drawn full width so the city reads as sitting on the river. -->
    <path d="M0 495 H1600" stroke-opacity=".6" stroke-width="2"/>

    <g transform="translate(280 134) scale(.65)">

      <g stroke-opacity=".9" stroke-width="3">

        <!-- West Philadelphia: low blocks, a rooftop water tower, a stack. -->
        <path d="M-430 555 V470 H-380 V555"/>
        <path d="M-370 555 V495 H-320 V555"/>
        <path d="M-310 555 V450 H-262 V555"/>
        <path d="M-300 450 V434 H-272 V450"/>
        <path d="M-250 555 V500 H-200 V555"/>
        <path d="M-190 555 V418 H-176 V555"/>
        <path d="M-160 555 V490 H-110 V555"/>
        <path d="M-100 555 V506 H-40 V555"/>
        <path d="M-30 555 V478 H20 V555"/>

        <!-- Rowhouses. -->
        <path d="M30 555 V500 L60 478 L90 500 L120 478 L150 500 V555"/>
        <path d="M68 488 V470 H78 V494"/>
        <path d="M128 488 V470 H138 V494"/>

        <!-- Cira Centre: faceted glass prism. -->
        <path d="M160 555 V420 L175 389 H205 L220 420 V555"/>

        <!-- FMC Tower: flat glass shaft with a parapet. -->
        <path d="M230 555 V292 H292 V555"/>
        <path d="M236 292 V278 H286 V292"/>

        <path d="M300 555 V470 H338 V555"/>

        <!-- Murano. -->
        <path d="M346 555 V375 H388 V555"/>
        <path d="M358 375 V362 H376 V375"/>

        <!-- Two Commerce Square: pyramid cap and setback bustle. -->
        <path d="M396 555 V338 H454 V555"/>
        <path d="M396 338 L425 305 L454 338"/>
        <path d="M454 555 V430 H476 V555"/>

        <!-- One Commerce Square: its twin. -->
        <path d="M484 555 V340 H542 V555"/>
        <path d="M484 340 L513 308 L542 340"/>

        <!-- Three Logan Square: stepped crown and roof fins. -->
        <path d="M552 555 V300 H612 V555"/>
        <path d="M552 300 V288 H566 V276 H575 V264 H589 V276 H598 V288 H612 V300"/>
        <path d="M582 264 V244"/>

        <!-- BNY Mellon Center: glass pyramid crown. -->
        <path d="M620 555 V300 H690 V555"/>
        <path d="M620 300 L655 254 L690 300"/>

        <!-- Comcast Center: flat slab with its notched crown. -->
        <path d="M700 555 V184 H752 V204 H780 V555"/>

        <!-- Comcast Technology Center: tapered shaft, crown box, and mast. -->
        <path d="M790 555 L798 172 H854 L862 555"/>
        <path d="M812 172 V150 H840 V172"/>
        <path d="M826 150 V120"/>
        <path d="M820 132 H832"/>

        <!-- One Liberty Place: stepped gables rising to the spire. -->
        <path d="M872 555 V300 H954 V555"/>
        <path d="M872 300 V284 H892 V268 H902 V252 H908 V216 L913 200 L918 216 V252 H924 V268 H934 V284 H954 V300"/>

        <!-- Two Liberty Place: the same crown, one tier shorter. -->
        <path d="M964 555 V330 H1034 V555"/>
        <path d="M964 330 V316 H980 V300 H988 V272 L993 262 L999 240 L1005 262 L1010 272 V300 H1018 V316 H1034 V330"/>

        <!-- City Hall: mansard base, corner pavilions, clock stage, William Penn. -->
        <path d="M1044 555 V462 H1156 V555"/>
        <path d="M1044 462 L1058 444 H1142 L1156 462"/>
        <path d="M1058 444 L1066 430 L1074 444"/>
        <path d="M1126 444 L1134 430 L1142 444"/>
        <path d="M1082 444 V398 H1118 V444"/>
        <path d="M1082 398 V380 H1118 V398"/>
        <circle cx="1100" cy="389" r="7"/>
        <path d="M1082 380 L1100 358 L1118 380"/>
        <path d="M1100 358 V346"/>
        <path d="M1093 348 H1107"/>
        <circle cx="1100" cy="341" r="5"/>

        <!-- G. Fred DiBona Jr. Building: sloped roof and antenna. -->
        <path d="M1150 555 V342 L1202 318 V555"/>
        <path d="M1190 318 V268"/>

        <!-- PSFS Building: service base, slab, and the rooftop sign. -->
        <path d="M1212 555 V440 H1228 V555"/>
        <path d="M1228 555 V368 H1288 V555"/>
        <path d="M1240 368 V348 H1288 V368"/>
        <path d="M1264 348 V326"/>

        <!-- Benjamin Franklin Bridge, carrying the deck across to Camden. -->
        <path d="M1300 500 H2031"/>
        <path d="M1330 575 V378 H1370 V575"/>
        <path d="M1660 575 V378 H1700 V575"/>
        <path d="M1300 470 Q1325 410 1350 378"/>
        <path d="M1350 378 Q1515 620 1680 378"/>
        <path d="M1680 378 Q1860 432 2031 492"/>

        <!-- Camden, across the river. -->
        <path d="M1790 555 V520 H1840 V555"/>
        <path d="M1852 555 V532 H1890 V555"/>
        <path d="M1940 555 V524 H1990 V555"/>
      </g>

      <!-- Low-rise city in front of the towers, mullions, bridge steelwork. -->
      <g stroke-opacity=".45" stroke-width="3">
        <path d="M-430 522 H-330 V510 H-240 V524 H-150 V512 H-60 V522 H90 V508 H180 V524 H260 V512 H340 V526 H420 V510 H510 V522 H600 V508 H690 V520 H780 V506 H870 V518 H960 V510 H1050 V524 H1140 V512 H1230 V520 H1300"/>

        <path d="M175 389 V555 M205 389 V555"/>
        <path d="M160 470 L220 440 M160 508 L220 478"/>
        <path d="M244 555 V292 M262 555 V292 M278 555 V292"/>
        <path d="M410 555 V338 M425 555 V338 M440 555 V338"/>
        <path d="M498 555 V340 M513 555 V340 M528 555 V340"/>
        <path d="M566 555 V300 M582 555 V300 M598 555 V300"/>
        <path d="M634 555 V300 M655 555 V300 M676 555 V300"/>
        <path d="M634 282 H676 M644 270 H666 M655 300 V254"/>
        <path d="M716 555 V184 M736 555 V184 M764 555 V204"/>
        <path d="M808 555 V176 M826 555 V172 M844 555 V176"/>
        <path d="M888 555 V300 M913 555 V300 M938 555 V300"/>
        <path d="M872 300 L913 252 L954 300 M892 284 L913 258 L934 284"/>
        <path d="M980 555 V330 M999 555 V330 M1018 555 V330"/>
        <path d="M964 330 L999 290 L1034 330"/>
        <path d="M1166 555 V338 M1186 555 V329"/>
        <path d="M1246 555 V368 M1270 555 V368"/>
        <path d="M700 300 H780 M790 300 H862 M872 400 H954 M964 420 H1034 M620 400 H690 M552 400 H612"/>

        <path d="M1330 420 H1370 M1330 460 H1370 M1330 500 H1370"/>
        <path d="M1660 420 H1700 M1660 460 H1700 M1660 500 H1700"/>
        <path d="M1400 440 V500 M1449 480 V500 M1581 480 V500 M1630 440 V500"/>
        <path d="M1300 508 H2031"/>
      </g>

      <!-- Reflections in the Delaware. -->
      <g stroke-opacity=".38" stroke-width="3">
        <path d="M262 562 V604"/>
        <path d="M425 562 V614"/>
        <path d="M582 562 V626"/>
        <path d="M655 562 V620"/>
        <path d="M740 562 V648"/>
        <path d="M826 562 V670"/>
        <path d="M913 562 V656"/>
        <path d="M999 562 V630"/>
        <path d="M1100 562 V612"/>
        <path d="M1264 562 V608"/>
        <path d="M1350 580 V644"/>
        <path d="M1680 580 V644"/>
      </g>
    </g>

    <!-- Water, drawn full width beneath the city. -->
    <g stroke-opacity=".5" stroke-width="2">
      <path d="M0 560 C320 546, 560 574, 880 558 S1400 536, 1600 552"/>
      <path d="M0 620 C340 606, 600 634, 920 616 S1420 588, 1600 612"/>
      <path d="M0 680 C300 668, 700 696, 1000 680 S1450 656, 1600 674"/>
    </g>
  </g>
</svg>
