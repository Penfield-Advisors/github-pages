# --- Site identity -----------------------------------------------------------
title: Penfield Advisors
tagline: Education Advisory
description: >-
  Penfield Advisors LLC is an independent advisory practice supporting education
  organizations with growth planning, operational insight, and executive-level
  problem solving.

# Deployment target. The site is served from the custom domain in ./CNAME, so it
# sits at the web root and `baseurl` is empty. `url` must stay in sync with the
# custom domain: jekyll-seo-tag builds canonical tags and jekyll-sitemap builds
# sitemap entries from it.
url: "https://penfieldadvisors.com"
baseurl: ""

lang: en_US
timezone: America/New_York

# --- Company details ---------------------------------------------------------
# Values marked PLACEHOLDER are still unconfirmed. Update them here and every
# page picks up the change.
company:
  legal_name: Penfield Advisors LLC
  email: dcarr@penfieldadvisors.com
  phone_display: "(555) 010-1234"          # PLACEHOLDER
  phone_link: "+15550101234"               # PLACEHOLDER
  address_line: "123 Placeholder Way, Suite 100"  # PLACEHOLDER
  address_locality: "West Chester"
  address_region: "PA"
  address_postal: "00000"                  # PLACEHOLDER
  hours: "Monday – Friday, 9:00 AM – 6:00 PM ET"
  response_time: "within two business days"       # PLACEHOLDER
  linkedin: "https://www.linkedin.com/in/darbycarr/"

founder:
  name: "Darby Carr"
  role: "Founder & Managing Director"
  email: "dcarr@penfieldadvisors.com"
  linkedin: "https://www.linkedin.com/in/darbycarr/"

# --- Navigation --------------------------------------------------------------
nav:
  - title: Home
    url: /
  - title: About
    url: /about/
  - title: Contact
    url: /contact/

# --- Build -------------------------------------------------------------------
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .github
